---
layout: default
title: ahoque.org
---

<div id="home">
    <img src="{{ 'assets/images/ahoqueali.png' | relative_url }}" alt="ahoqueali" style="width:100px; border-radius:50%; display:block; margin:0 0 20px; margin-top:-80px;" />
    <h1>Blog Posts</h1>
    <ul class="posts">
        {% for post in site.posts %}
        <li><span>{{ post.date | date_to_string }}</span> &raquo; <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></li>
        {% endfor %}
    </ul>
</div>
